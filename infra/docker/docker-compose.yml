services:
  postgres:
    image: postgres:16-alpine
    container_name: mamori-postgres
    restart: always
    environment:
      POSTGRES_USER: mamori_user
      POSTGRES_PASSWORD: mamori_password
      POSTGRES_DB: mamori_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamori_user -d mamori_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
